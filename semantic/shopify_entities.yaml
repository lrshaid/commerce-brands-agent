snapshot: "reconstructed-2026-08-26"
api_version: "2026-04"
entities:
  orders:
    grain: one row per order
    primary_key: id
    source: orders_query
    measures: [current_subtotal_price, current_total_tax, current_total_price]
  customers:
    grain: one row per customer
    primary_key: id
    source: customers_query
    measures: [number_of_orders, amount_spent]
  order_line_items:
    grain: one row per order line
    primary_key: id
    source: {nested_in: orders}
    measures: [quantity, current_quantity, discounted_total]
  products:
    grain: one row per product
    primary_key: id
    source: products_query
    measures: []
  product_variants:
    grain: one row per product variant
    primary_key: id
    source: {nested_in: products}
    measures: [price, inventory_quantity]
  inventory_items:
    grain: one row per inventory item
    primary_key: id
    source: inventory_items_query
    measures: [unit_cost]
  inventory_levels:
    grain: one row per inventory item and location
    primary_key: inventory_level_key
    source: inventory_levels_query
    measures: [available_quantity]
  locations:
    grain: one row per location
    primary_key: id
    source: locations_query
    measures: []
  collections:
    grain: one row per collection
    primary_key: id
    source: collections_query
    measures: []
  collects:
    grain: one row per product and collection membership
    primary_key: collect_key
    source: collections_query
    measures: []
  refunds:
    grain: one row per refund
    primary_key: id
    source: {nested_in: orders}
    measures: [total_refunded]
  refund_line_items:
    grain: one row per refunded order line
    primary_key: id
    source: {nested_in: refunds}
    measures: [quantity, subtotal, total_tax]
  refund_order_adjustments:
    grain: one row per refund order adjustment
    primary_key: id
    source: {nested_in: refunds}
    measures: [amount, tax_amount]
  returns:
    grain: one row per return
    primary_key: id
    source: returns_query
    measures: []
  return_line_items:
    grain: one row per returned order line
    primary_key: id
    source: {nested_in: returns}
    measures: [quantity, subtotal, total_tax]
  order_transactions:
    grain: one row per order payment transaction
    primary_key: id
    source: {nested_in: orders}
    measures: [amount]
  tender_transactions:
    grain: one row per tender transaction
    primary_key: id
    source: tender_transactions_query
    measures: [amount]
  balance_transactions:
    grain: one row per Shopify Payments balance transaction
    primary_key: id
    source: balance_transactions_query
    measures: [amount, fee, net]
  fulfillments:
    grain: one row per fulfillment
    primary_key: id
    source: {nested_in: orders}
    measures: []
  fulfillment_line_items:
    grain: one row per fulfillment and order line
    primary_key: fulfillment_line_key
    source: {nested_in: fulfillments}
    measures: [quantity]
  fulfillment_orders:
    grain: one row per fulfillment order
    primary_key: id
    source: fulfillment_orders_query
    measures: []
  fulfillment_order_line_items:
    grain: one row per fulfillment-order line
    primary_key: id
    source: {nested_in: fulfillment_orders}
    measures: [remaining_quantity, total_quantity]
  shipping_lines:
    grain: one row per order shipping line
    primary_key: id
    source: {nested_in: orders}
    measures: [discounted_price]
  discount_applications:
    grain: one row per order discount application
    primary_key: discount_application_key
    source: {nested_in: orders}
    measures: [value]
  discount_allocations:
    grain: one row per order line and discount application
    primary_key: discount_allocation_key
    source: {nested_in: order_line_items}
    measures: [allocated_amount]
  tax_lines:
    grain: one row per taxable owner and tax title
    primary_key: tax_line_key
    source: {nested_in: orders}
    measures: [price, rate]
  metafields:
    grain: one row per owner, namespace, and key
    primary_key: id
    source: metafields_query
    measures: []
  gift_cards:
    grain: one row per gift card
    primary_key: id
    source: gift_cards_query
    measures: [initial_value, balance]
  companies:
    grain: one row per B2B company
    primary_key: id
    source: companies_query
    measures: []
  company_locations:
    grain: one row per B2B company location
    primary_key: id
    source: {nested_in: companies}
    measures: []
  draft_orders:
    grain: one row per draft order
    primary_key: id
    source: draft_orders_query
    measures: [subtotal_price, total_price]
  abandoned_checkouts:
    grain: one row per abandoned checkout
    primary_key: id
    source: abandoned_checkouts_query
    measures: [subtotal_price, total_price]
  price_rules:
    grain: one row per price rule
    primary_key: id
    source: price_rules_query
    measures: [value]
  discount_codes:
    grain: one row per discount code
    primary_key: id
    source: discount_codes_query
    measures: [usage_count]


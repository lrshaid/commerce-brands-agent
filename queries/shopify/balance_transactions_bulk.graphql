query BalanceTransactionsBulk($query: String) {
  shopifyPaymentsAccount {
    balanceTransactions(first: 250, query: $query, sortKey: PROCESSED_AT) {
      edges { node {
        id
        type
        test
        amount { amount currencyCode }
        fee { amount currencyCode }
        net { amount currencyCode }
        transactionDate
        associatedOrder { id }
        associatedPayout { id status }
      } }
    }
  }
}

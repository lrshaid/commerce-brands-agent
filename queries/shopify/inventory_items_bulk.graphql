query InventoryItemsBulk ($query: String) {
  inventoryItems(query: $query) {
    edges { node {
      id
      sku
      tracked
      requiresShipping
      createdAt
      updatedAt
      unitCost { amount currencyCode }
      countryCodeOfOrigin
      provinceCodeOfOrigin
      harmonizedSystemCode
      duplicateSkuCount
      countryHarmonizedSystemCodes(first: 50) { edges { node { countryCode harmonizedSystemCode } } }
    } }
  }
}

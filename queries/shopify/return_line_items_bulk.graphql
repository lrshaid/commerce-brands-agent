query ReturnLineItemsBulk ($query: String) {
  orders(query: $query) {
    edges { node {
      id
      updatedAt
      returns(first: 50) {
        edges { node {
          id
          name
          status
          totalQuantity
          closedAt
          requestApprovedAt
          returnLineItems(first: 50) { edges { node { id quantity customerNote returnReasonNote ... on ReturnLineItem { fulfillmentLineItem { id lineItem { id } } } } } }
          refunds(first: 10) { edges { node { id } } }
        } }
      }
    } }
  }
}
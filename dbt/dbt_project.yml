    - {metric_id: 'MaEYwM', event_type: subscribed-to-list}
    - {metric_id: 'WMvQyv', event_type: subscribed-to-text-messaging-marketing}
    - {metric_id: 'SZtpmQ', event_type: subscribed-to-text-messaging-transactional}
    - {metric_id: 'TZ5TXy', event_type: ticket-closed}
    - {metric_id: 'R86XLV', event_type: ticket-created}
    - {metric_id: 'KugFeL', event_type: unsubscribed-from-list}
    - {metric_id: 'UZ5X42', event_type: unsubscribed-from-text-messaging-marketing}
    - {metric_id: 'Ycf6uQ', event_type: unsubscribed-from-text-messaging-transactional}
    - {metric_id: 'SvsKkB', event_type: unsuppressed-from-list-for-email-marketing}
    - {metric_id: 'JQVcwM', event_type: updated-email-preferences}
    - {metric_id: 'VP4vad', event_type: web-chat-conversation-escalated}
  # Klaviyo metric dictionary: metric_id -> canonical event_type, maintained by
  # the deployment.  Empty by default: an unknown metric keeps event_type NULL
  # and never guesses a mapping.
models:
  commerce:
    +persist_docs: {relation: true, columns: true}
    +materialized: view
    staging:
      refunds:
        +schema: analytics
        +tags: [refund_staging]
      returns:
        +schema: analytics
        +tags: [returns_staging]
      shopify:
        +schema: analytics
        +tags: [shopify_staging]
      shopify_shadow:
        +schema: analytics_shadow
        +tags: [shopify_entity_shadow]
      customers:
        +schema: analytics
        +tags: [customers_staging]
      products:
        +schema: analytics
        +tags: [products_staging]
      payments:
        +schema: analytics
      fulfillments:
        +schema: analytics
      fulfillment_orders:
        +schema: analytics
      inventory:
        +schema: analytics
      klaviyo:
        +schema: analytics
      platform:
        +tags: [platform_smoke]
      ga4:
        +schema: analytics
        +tags: [ga4_staging]
    intermediate:
      +schema: analytics
      +tags: [business_intermediate]
      ga4:
        +schema: analytics
        +tags: [ga4_intermediate]
    marts:
      +schema: analytics
      +tags: [business_marts]
      +materialized: table
    reports:
      platform:
        +tags: [platform_smoke]
        +materialized: table

name: commerce
version: '1.0.0'
config-version: 2
profile: commerce
model-paths: [models]
test-paths: [tests]
macro-paths: [macros]
clean-targets: [target, dbt_packages]
vars:
  # GA4 export is deliberately opt-in.  A property/dataset must be supplied
  # by the deployment that owns the export; there is no production default.
  ga4_export_enabled: false
  ga4_project: ''
  ga4_dataset: ''
  ga4_property_id: ''
  ga4_scan_start_date: ''
  ga4_scan_end_date: ''
  ga4_report_start_date: ''
  ga4_report_end_date: ''
  ga4_start_date: ''
  ga4_end_date: ''
  ga4_property_timezone: ''
  ga4_stream_ids: []
  ga4_shopify_order_identifier_fields: []
  ga4_attribution_enabled: false
  ga4_attribution_lookback_days: ''
  ga4_attribution_output_start_date: ''
  ga4_attribution_output_end_date: ''
  ga4_owned_hosts: []
  ga4_channel_taxonomy: []
  ga4_funnel_steps: ['add_to_cart', 'begin_checkout', 'purchase']
  ga4_shop_key: ''
  ga4_unknown_consent_policy: exclude
  klaviyo_metric_map:
    - {metric_id: 'NcwPP8', event_type: received-email}
    - {metric_id: 'JBF4Na', event_type: opened-email}
    - {metric_id: 'Lq6WiD', event_type: clicked-email}
    - {metric_id: 'Wj4VPg', event_type: subscribed-to-email-marketing}
    - {metric_id: 'XCtgV5', event_type: unsubscribed-from-email-marketing}
    - {metric_id: 'M37YVg', event_type: bounced-email}
    - {metric_id: 'XuLwAR', event_type: added-to-list}
    - {metric_id: 'VWgW4i', event_type: bounce-suppression-added}
    - {metric_id: 'TXatRk', event_type: bounce-suppression-removed}
    - {metric_id: 'SpfPfa', event_type: bounced-push}
    - {metric_id: 'NPxSrK', event_type: clicked-email-to-unsubscribe}
    - {metric_id: 'TcE5xx', event_type: clicked-text-message}
    - {metric_id: 'U3Pe7G', event_type: coupon-assigned}
    - {metric_id: 'WRXv2j', event_type: coupon-used}
    - {metric_id: 'QXWzFG', event_type: customer-hub-add-to-favorites}
    - {metric_id: 'RBTGKT', event_type: customer-hub-clicked-add-to-cart}
    - {metric_id: 'XGK4jS', event_type: customer-hub-clicked-chat-tab}
    - {metric_id: 'WAYvFA', event_type: customer-hub-clicked-coupons}
    - {metric_id: 'Vz5z7C', event_type: customer-hub-clicked-for-you-tab}
    - {metric_id: 'TCphge', event_type: customer-hub-clicked-hub-launcher-chat}
    - {metric_id: 'Wksefx', event_type: customer-hub-clicked-order-line-item}
    - {metric_id: 'S2n8x2', event_type: customer-hub-clicked-orders-tab}
    - {metric_id: 'VUYWtj', event_type: customer-hub-clicked-product}
    - {metric_id: 'TwhYNs', event_type: customer-hub-clicked-profile-tab}
    - {metric_id: 'WDgvNm', event_type: customer-hub-clicked-shopify-return}
    - {metric_id: 'XGnpgi', event_type: customer-hub-clicked-track-shipment}
    - {metric_id: 'Y7wEZg', event_type: customer-hub-clicked-view-order}
    - {metric_id: 'TJV3nu', event_type: customer-hub-coupon-applied}
    - {metric_id: 'WAZyFu', event_type: customer-hub-login}
    - {metric_id: 'HsgdUi', event_type: dropped-email}
    - {metric_id: 'SS8kVb', event_type: escalated-customer-agent-conversation}
    - {metric_id: 'Un4Urp', event_type: failed-to-deliver-automated-response-text-message}
    - {metric_id: 'TDY5px', event_type: failed-to-deliver-text-message}
    - {metric_id: 'R2TRrK', event_type: invalid-email-suppression-added}
    - {metric_id: 'WTUPVq', event_type: manually-suppressed-from-email-marketing}
    - {metric_id: 'TvbJnS', event_type: manually-unsuppressed-from-email-marketing}
    - {metric_id: 'QBXKWe', event_type: marked-email-as-spam}
    - {metric_id: 'TGuzPH', event_type: merged-profile}

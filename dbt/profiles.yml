commerce:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GOOGLE_CLOUD_PROJECT', 'commerce-agents-dev') }}"
      dataset: "{{ env_var('DBT_DATASET', 'platform_smoke') }}"
      location: "{{ env_var('GOOGLE_CLOUD_REGION', 'us-central1') }}"
      threads: 2
      job_execution_timeout_seconds: 300
      job_retries: 1
      maximum_bytes_billed: 1073741824
      priority: interactive

version: 2
models:
  - name: fct_returns
    description: >-
      Shopify-native RMV fact at original-order-line grain. Refund values win;
      RMV stored negative. Recognition date = refund created date; return-only
      rows stay null until a refund exists.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [shop_key, order_line_item_id]
    columns:
      - name: shop_key
        data_tests: [not_null]
      - name: order_gid
        data_tests: [not_null]
      - name: order_line_item_id
        data_tests: [not_null]
      - name: match_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [matched, refund_no_return, return_no_refund]
      - name: rmv_recognition_ts_utc
        description: >-
          Refund created date (recognition date); null for return_no_refund
          rows that are not yet recognized.
      - name: rmv_merchandise_amount
        data_tests: [not_null]
      - name: rmv_tax_amount
        data_tests: [not_null]

  - name: metric_revenue_daily
    description: Daily revenue-core metrics. EMV is intentionally absent until a valid exchange contract exists.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [shop_key, metric_date]
    columns:
      - name: shop_key
        data_tests: [not_null]
      - name: metric_date
        data_tests: [not_null]
      - name: gmv_amount
        data_tests: [not_null]
      - name: rmv_amount
        data_tests: [not_null]
      - name: nmv_amount
        data_tests: [not_null]

  - name: dim_customer_rfm
    description: >-
      Customer RFM per Klaviyo's methodology: recency by fixed day bands
      (180/365), frequency and monetary by 33rd/66th percentiles, scores 1-3
      and six customer groups over all 27 combinations. Monetary scores gross
      purchases; net_contribution is lifetime value.
    columns:
      - name: customer_identity_id
        data_tests: [not_null, unique]
      - name: r_score
        data_tests: [not_null]
      - name: f_score
        data_tests: [not_null]
      - name: m_score
        data_tests: [not_null]
      - name: rfm_combo
        data_tests: [not_null]
      - name: rfm_group
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Champions, Loyal, Recent, Needs attention, At risk, Inactive]
      - name: net_contribution
        data_tests: [not_null]

  - name: fct_customer_cohorts
    description: >-
      Customer acquisition cohorts by first-purchase month, with monthly
      activity (customers, orders, spend) and months since first purchase.
    columns:
      - name: cohort_month
        data_tests: [not_null]
      - name: activity_month
        data_tests: [not_null]
      - name: months_since_first_purchase
        data_tests: [not_null]

  - name: fct_ga4__customer_attribution
    description: >-
      Marketing + customer mart. One row per matched GA4 purchase attributed
      touchpoint, joined to its Shopify order and customer. Weights only; no
      revenue/financial policy. Identity is order-linked (no cross-device
      stitching).
    columns:
      - name: shop_key
        data_tests: [not_null]
      - name: order_gid
        data_tests: [not_null]
      - name: purchase_observation_key
        data_tests: [not_null]
      - name: session_definition
        data_tests:
          - accepted_values:
              arguments:
                values: [ga4_native, ga4_custom_30m]
      - name: attribution_model
        data_tests:
          - accepted_values:
              arguments:
                values: [first_click, last_click, first_click_30days, linear_multi_click]
      - name: attribution_weight
        data_tests: [not_null]

  - name: metric_ga4__funnel_daily
    description: >-
      Digital funnel mart: sessions -> users -> configured funnel steps by day
      and entry channel, based on custom 30-minute sessions. Steps count
      distinct sessions reaching each event name; no revenue/financial policy.
      Single-shop assumption: property_id is the shop's GA4 property.
    columns:
      - name: property_id
        data_tests: [not_null]
      - name: metric_date
        data_tests: [not_null]
      - name: channel_group
        data_tests: [not_null]
      - name: sessions
        data_tests: [not_null]
      - name: users
        data_tests: [not_null]
      - name: purchase_sessions
        data_tests: [not_null]

  - name: fct_order_sale_line
    description: >-
      Order sale line fact: one row per order line (sale side). Post-promotion
      shop amounts; cancelled orders flagged (not filtered); gift-card lines
      flagged for merchandise-only reporting.
    columns:
      - name: shop_key
        data_tests: [not_null]
      - name: order_gid
        data_tests: [not_null]
      - name: order_line_item_id
        data_tests:
          - not_null
          - unique
      - name: metric_date
        data_tests: [not_null]
      - name: metric_year
        data_tests: [not_null]
      - name: is_cancelled_order
        data_tests: [not_null]
      - name: is_gift_card
        data_tests: [not_null]
      - name: discounted_total_shop_amount
        data_tests: [not_null]

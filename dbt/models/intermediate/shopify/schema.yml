version: 2

models:
  - name: int_shopify__customer_identity
    description: >
      Customer identity resolved from email (single shop). Key is
      sha256(lower(trim(email))); customers without email fall back to their own
      customer_gid (guests). Multiple customer_gid sharing an email consolidate
      to a canonical customer. Raw email is never emitted.
    config:
      tags: [intermediate_view]
    columns:
      - name: customer_identity_id
        data_tests: [not_null, unique]
      - name: canonical_customer_gid
        data_tests: [not_null]
      - name: linked_customer_count
        data_tests: [not_null]

  - name: int_shopify__customer_purchase_summary
    description: >
      Per-identity purchase summary (single shop): first/last purchase, order
      count, gross spend (post-promotion, non-cancelled) and net contribution
      (gross + recognized refunds) as lifetime value. Orders without a
      resolvable customer_gid are excluded.
    config:
      tags: [intermediate_view]
    columns:
      - name: customer_identity_id
        data_tests: [not_null, unique]
      - name: first_purchase_ts
        data_tests: [not_null]
      - name: last_purchase_ts
        data_tests: [not_null]
      - name: order_count
        data_tests: [not_null]
      - name: net_contribution
        data_tests: [not_null]

  - name: int_shopify__orders
    description: >
      Intermediate order-grain model (one row per order per extraction) with
      nested discount applications. Discount applications are requested by
      orders_bulk.graphql but the dummy store has none, so the array is empty
      for every order in the current dataset. Arrays are intended to be
      consumed via UNNEST.
    config:
      tags: [shopify_staging]
    columns:
      - name: observation_key
        data_tests: [not_null, unique]
      - name: shop_key
        data_tests: [not_null]
      - name: extraction_id
        data_tests: [not_null]
      - name: order_gid
        data_tests: [not_null]
      - name: discount_applications
        data_tests:
          - not_null:
              config: {severity: warn}

  - name: int_shopify__order_line_items
    description: >
      Intermediate order-line-grain model with nested discount allocations.
      discountAllocations is NOT requested by the active orders_bulk.graphql
      query, so the array is currently empty for every line. To populate it,
      extend the GraphQL query and re-extract. Arrays are intended to be
      consumed via UNNEST.
    config:
      tags: [shopify_staging]
    columns:
      - name: observation_key
        data_tests: [not_null, unique]
      - name: shop_key
        data_tests: [not_null]
      - name: extraction_id
        data_tests: [not_null]
      - name: line_item_gid
        data_tests: [not_null]
      - name: order_gid
        data_tests: [not_null]
      - name: discount_allocations
        data_tests:
          - not_null:
              config: {severity: warn}

  - name: int_shopify__shipping_lines
    description: >
      Intermediate shipping-line-grain model. Shipping lines are requested by
      the active query but the dummy store has none, so this model currently
      returns zero rows.
    config:
      tags: [shopify_staging]
    columns:
      - name: observation_key
        data_tests: [not_null, unique]
      - name: shop_key
        data_tests: [not_null]
      - name: extraction_id
        data_tests: [not_null]
      - name: shipping_line_gid
        data_tests: [not_null]
      - name: order_gid
        data_tests: [not_null]

  - name: int_shopify__refunds
    description: >
      Intermediate refund model at REFUND LINE ITEM grain (user-defined grain),
      with refund header fields denormalised and transactions / order
      adjustments nested as arrays. Refunds with no line items are excluded by
      design. Arrays are intended to be consumed via UNNEST.
    config:
      tags: [refund_staging]
    columns:
      - name: observation_key
        data_tests: [not_null, unique]
      - name: shop_key
        data_tests: [not_null]
      - name: extraction_id
        data_tests: [not_null]
      - name: refund_gid
        data_tests: [not_null]
      - name: order_gid
        data_tests: [not_null]
      - name: refund_line_item_gid
        data_tests: [not_null]
      - name: order_line_item_id
        data_tests: [not_null]
      - name: transactions
        data_tests:
          - not_null:
              config: {severity: warn}
      - name: adjustments
        data_tests:
          - not_null:
              config: {severity: warn}

  - name: int_shopify__return_line_items
    description: >
      Intermediate return-line-grain model with return header fields
      denormalised and linked return refunds nested as an array. Arrays are
      intended to be consumed via UNNEST.
    config:
      tags: [returns_staging]
    columns:
      - name: observation_key
        data_tests: [not_null, unique]
      - name: shop_key
        data_tests: [not_null]
      - name: extraction_id
        data_tests: [not_null]
      - name: return_gid
        data_tests: [not_null]
      - name: order_gid
        data_tests: [not_null]
      - name: return_line_item_gid
        data_tests: [not_null]
      - name: order_line_item_id
        data_tests: [not_null]
      - name: return_refunds
        data_tests:
          - not_null:
              config: {severity: warn}
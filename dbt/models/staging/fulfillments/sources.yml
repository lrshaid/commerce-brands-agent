version: 2
sources:
  - name: shopify_fulfillments
    database: "{{ env_var('GOOGLE_CLOUD_PROJECT', 'commerce-agents-dev') }}"
    schema: raw_shopify
    tables:
      - name: fulfillments
        description: Exact HTTP response pages for the orders root and owner-scoped fulfillment pages.
        config:
          meta:
            dagster:
              asset_key: [shopify, fulfillments]
      - name: ingestion_runs
        config:
          meta:
            dagster:
              asset_key: [shopify_fulfillments, ingestion_runs]
models:
  - name: stg_shopify__fulfillments
    description: Fulfillment observations keyed to their owning order page; not shipment recognition.
    columns:
      - name: observation_key
        data_tests: [not_null, unique]
      - name: fulfillment_gid
        data_tests: [not_null]
      - name: order_gid
        data_tests: [not_null]

version: 2
sources:
  - name: shopify_order_transactions
    database: "{{ env_var('GOOGLE_CLOUD_PROJECT', 'commerce-agents-dev') }}"
    schema: raw_shopify
    tables:
      - name: order_transactions
      - name: ingestion_runs
models:
  - name: stg_shopify__order_transactions
    columns:
      - name: observation_key
        data_tests: [unique, not_null]
      - name: transaction_gid
        data_tests: [not_null]
  - name: int_shopify__order_transactions
    description: Latest observed state per shop and transaction. Refund transactions are included once.

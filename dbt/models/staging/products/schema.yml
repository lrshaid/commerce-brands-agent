version: 2
sources:
  - name: shopify_products
    database: "{{ env_var('GOOGLE_CLOUD_PROJECT', 'commerce-agents-dev') }}"
    schema: raw_shopify
    tables:
      - name: products
      - name: variants
      - name: ingestion_runs
models:
  - name: stg_shopify__product_pages
    columns:
      - name: page_key
        data_tests: [not_null, unique]
      - name: extraction_id
        data_tests: [not_null]
      - name: published_at
        data_tests: [not_null]
  - name: stg_shopify__variant_pages
    columns:
      - name: page_key
        data_tests: [not_null, unique]
      - name: product_gid
        data_tests: [not_null]
  - name: stg_shopify__products
    columns:
      - name: observation_key
        data_tests: [not_null, unique]
      - name: product_gid
        data_tests: [not_null]
      - name: shop_key
        data_tests: [not_null]
  - name: stg_shopify__product_variants
    columns:
      - name: observation_key
        data_tests: [not_null, unique]
      - name: variant_gid
        data_tests: [not_null]
      - name: product_gid
        data_tests: [not_null]

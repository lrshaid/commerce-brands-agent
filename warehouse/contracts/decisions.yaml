version: 1
# No decision is implicitly accepted by the preflight.
decisions:
  typed_model_naming:
    affects: [typed]
    status: decided_2026_09_06
    decision: >
      The typed business-grain layer uses the prefix typed_shopify__* and lives
      under dbt/models/typed/shopify/. This scope is referenced in
      semantic/warehouse_models.yaml as 'typed' and is materialised in the
      analytics schema with tag shopify_typed.

  typed_refund_grain:
    affects: [typed, returns, marts]
    status: decided_2026_09_06
    decision: >
      typed_shopify__refunds is deliberately built at REFUND LINE ITEM grain
      (one row per refund line item), not at the refund-header grain defined in
      semantic/shopify_entities.yaml. Refund header fields are denormalised on
      each line, and transactions / order adjustments are nested as arrays.
      Refunds with no line items are excluded by this grain choice.

  deleted_pages_models:
    affects: [staging, tests]
    status: decided_2026_09_06
    decision: >
      stg_shopify__refund_pages and stg_shopify__return_pages are removed as
      dbt models because pages are transport metadata (lineage lives in
      raw_shopify.ingestion_runs), not business entities. The raw-page parsing
      logic is preserved as dbt macros (shopify_refund_pages / shopify_return_pages)
      so the remaining flat staging models can still build from raw directly.

  uncaptured_discount_objects:
    affects: [typed]
    status: decided_2026_09_06
    decision: >
      discountApplications and shippingLines ARE requested by the active
      orders_bulk.graphql query, but the dummy store has no child data (0
      shipping-line records and 0 discount-application records in raw_shopify.orders).
      discountAllocations is NOT requested by the active query, so it is not merely
      uncaptured: it is not asked for. totalDiscountsSet at order level is sufficient
      for metric_revenue_daily while no real discounts exist. Before trusting the
      typed nested arrays with live discounts, validate that the child nodes are
      actually materialised in raw_shopify.orders after extending the GraphQL query
      and re-extracting.

  metrics_implemented_flags_2026_09_06:
    affects: [metrics]
    status: decided_2026_09_06
    decision: >
      gmv, order_count and gross_units are marked implemented=true because they
      are verified against real dummy-store data (GMV 9298.69, 101 orders, 208
      units). rmv, nmv, returned_units and net_units remain implemented=false
      because the dummy store has 0 refunds and 0 returns; the full-outer-join
      and COALESCE-priority logic in fct_returns/metric_revenue_daily was never
      exercised by real data. Re-evaluate when live refunds/returns exist or a
      synthetic fixture materialises the blueprint cases in BigQuery.

  rmv_line_aggregation:
    affects: [returns, marts]
    status: decided_2026_09_05
    decision: >
      Aggregate refund_line_items and return_line_items to one row per original
      order line before the FULL OUTER JOIN in fct_returns. This prevents the
      known many-to-many fan-out when the same original line has multiple refund
      events and/or multiple return events. Refund values win per line; the
      aggregate preserves total quantity, subtotal and tax per side. This is an
      explicit implementation choice documented here, not a hidden deduplication.
    alternatives_rejected:
      - join_without_aggregation: duplicates RMV when multiple events exist per line
      - pick_latest_event: silently drops partial refund/return value
  raw_landing:
    affects: [staging]
    question: Supply the read-only raw envelope, JSON paths, shop key, version cursor and uniqueness guarantee for each source. Are rows current-state parents or versioned snapshots?
  exclusions:
    affects: [commercial]
    question: Keep staging business-logic-free and apply reporting exclusions as core flags, or drop rows in staging? Also reconcile exclude_cancelled=false with the unconditional exclusion in section 5.5.
  merchandise_taxonomy:
    affects: [commercial, product]
    question: Supply unit_style_type mapping, rule priority and tie policy; these columns are absent from the supplied taxonomy schema.
  return_event_matching:
    affects: [returns]
    question: Supply an event-level refund-to-return linkage or quantity allocation policy for repeated/partial events; original order line alone is not a unique event key.
  return_value_contract:
    affects: [returns]
    question: Map verified and unverified return line identifiers, discounted merchandise value and tax from actual landed fields; subtotalSet/totalTaxSet are not established Return fields.
  return_recognition:
    affects: [returns]
    question: Specify recognition fallbacks for refund-only, open-return and return-only rows where the selected timestamp does not exist; define refund_processed_at.
  adjustments:
    affects: [returns]
    question: Decide how discrepancy adjustments affect merchandise RMV; shipping and tax must remain separate under the merchandise-only invariant. Preserve refund/event keys for adjustment legs.
  exchanges:
    affects: [commercial, returns]
    question: Supply added-item exchange linkage and original-order resolution scoped by shop; do not detect arbitrary display names containing -E as exchanges.
  daily_fx:
    affects: [fx]
    question: Provide the daily rate table contract when fx.rule=daily; cfg_fx_rates currently has month_dt grain only.
  mapping_scope:
    affects: [retail, product]
    question: Specify shop scoping, rule priority and ties for location/channel/taxonomy mappings; the prescribed schemas omit these columns.
  inventory_rerun:
    affects: [inventory]
    question: For an already-published snapshot date, reject reruns or skip identical input? Specify atomic publication and handling of changed inputs; blind INSERT duplicates keys.
  customer_identity:
    affects: [customer]
    question: Define cross-shop customer equivalence, guest matching, timestamp tie-breaks and first-purchase restatement; shop-local numeric IDs cannot establish cross-shop identity.
  point_in_time:
    affects: [product]
    question: Supply historical attributes or first-load snapshot semantics for sale-time product attributes; current-state dimensions cannot reconstruct historical values.
  metrics_section_8:
    affects: [metrics]
    question: Supply missing section 8 for target selection, recaps, projections and explicitly-live models; S1-S4 are also absent but do not block fully specified infrastructure.
  addon_grains:
    affects: [addons]
    question: Confirm event-scoped enrichment keys and schemas per mounted role; joins must be unique and cannot change native row counts or values.
  erp_timing:
    affects: [addons]
    question: Physical-receipt timing must be a separately named third-party metric/date, not a replacement of the native ledger date; confirm the intended output.
  cdp_contract:
    affects: [sessions]
    question: Supply page/event/identity/order linkage fields and stable tie-break keys; recovered partial event-tracker SQL is not a ready-made provider contract.

version: 1
status: all_shopify_families_shadow
dataset_role: raw_shopify_shadow
source_contract: shopify_raw_v1

publication:
  mode: current_state_merge
  absent_source: do_nothing
  matched: update_all_non_key_columns
  new_key: insert
  stale_source: reject_batch
  extracted_at: merge_statement_current_timestamp
  temporary_table_ttl_hours: 18


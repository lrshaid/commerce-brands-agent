# GENERATED by scripts/generate_cube_model.py from semantic/serving_contract.yaml
# DO NOT EDIT BY HAND — edit the serving contract and re-run the generator.

cubes:
  - name: commercial_revenue
    sql_table: analytics.metric_revenue_daily

    dimensions:
      - name: shop_key       # tenant key — scoping is server-side
        sql: shop_key
        type: string
        public: false
      - name: extraction_id
        sql: extraction_id
        type: string
        public: false
      - name: sales_channel
        sql: sales_channel
        type: string
      - name: metric_date
        sql: metric_date
        type: time

    measures:
      # --- base (additive), from the mart ---
      - name: gmv
        sql: gmv_amount
        type: sum
        format: currency
        description: "post-discount pre-return merchandise value excluding exchange legs"
      - name: nmv
        sql: nmv_amount
        type: sum
        format: currency
        description: "GMV plus EMV plus stored-negative RMV. NMV assumes EMV=0 (exchange contract exchangeV2s invalid)"
      - name: rmv
        sql: rmv_amount
        type: sum
        format: currency
        description: "return merchandise value reconstructed from return and refund lines. RMV stored negative; do not subtract twice. recognized on refund created date; all matched rows are refund_no_return (no formal returns matched yet). Stored negative; nets into NMV — do not subtract twice."
      - name: emv
        sql: emv_amount
        type: sum
        format: currency
        public: false
        description: "exchange merchandise value. BLOCKED: exchange line contract (exchangeV2s) invalid; column is NULL by design"
      - name: order_count
        sql: orders
        type: sum
        description: "distinct completed orders in scope. orders is daily-distinct at the mart grain; summing across days is a period total, not a distinct-customer count"
      - name: gross_units
        sql: gross_units
        type: sum
        description: "gross merchandise units"
      - name: net_units
        sql: net_units
        type: sum
        description: "gross plus exchange minus returned units. net_units = gross + stored-negative returned units; exchange units are 0 (EMV blocked); return-unit sign correction requires warehouse rebuild"
      - name: traffic
        sql: traffic
        type: sum
        public: false
        description: "Shopify-visible online session proxy. BLOCKED: no GA4 export configured for this shop; traffic is NULL in the mart"
      # --- derived (ratio-of-sums; computed, not stored) ---
      - name: aov
        sql: "{gmv} / NULLIF({order_count}, 0)"
        type: number
        format: currency
        description: "GMV divided by orders. AOV basis follows its numerator (GMV); state the basis when quoting"
      - name: upt
        sql: "{gross_units} / NULLIF({order_count}, 0)"
        type: number
        description: "merchandise units divided by orders"
      - name: app
        sql: "{gmv} / NULLIF({gross_units}, 0)"
        type: number
        format: currency
        description: "GMV divided by merchandise units"

    pre_aggregations:
      - name: daily_rollup
        measures:
          - gmv
          - nmv
          - rmv
          - order_count
          - gross_units
          - net_units
        dimensions:
          - shop_key
          - sales_channel
        time_dimension: metric_date
        granularity: day
        refresh_key:
          sql: SELECT MAX(computed_at) FROM analytics.metric_revenue_daily

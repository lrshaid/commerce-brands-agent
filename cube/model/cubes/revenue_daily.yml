# Cube over the reconciled revenue-core mart.
#
# This is a SECOND expression of the metrics: the SOURCE OF TRUTH stays in
# semantic/serving_contract.yaml (+ the dbt marts). The hard business math
# (NMV=GMV+EMV+RMV, stored-negative RMV, cancelled exclusion, refund fan-out fix)
# lives in the mart — this cube only routes columns and rolls them up. Keep the
# two in sync (or generate this file from serving_contract.yaml).
#
# Grain of metric_revenue_daily: one row per
# (shop_key, extraction_id, metric_date, sales_channel). SUM measures give
# correct period totals because each order belongs to exactly one day (additive).
cubes:
  - name: revenue_daily
    public: false
    sql_table: analytics.metric_revenue_daily

    dimensions:
      - name: shop_key
        sql: shop_key
        type: string
        # Tenant key. In production, filter this via securityContext/queryRewrite
        # (see ../../README.md) rather than trusting the caller.
      - name: extraction_id
        sql: extraction_id
        type: string
      - name: sales_channel
        sql: sales_channel
        type: string
      - name: metric_date
        sql: metric_date
        type: time

    measures:
      # --- base, additive, target_validated on real data (run 55ac2056) ---
      - name: gmv
        sql: gmv_amount
        type: sum
        format: currency
      - name: nmv
        sql: nmv_amount
        type: sum
        format: currency
        description: "NMV = GMV + EMV + RMV. EMV is 0 by design (exchangeV2s invalid)."
      - name: rmv
        sql: rmv_amount
        type: sum
        format: currency
        description: "Return merchandise value, stored negative."
      - name: orders
        sql: orders
        type: sum
      - name: gross_units
        sql: gross_units
        type: sum
      - name: net_units
        sql: net_units
        type: sum

      # --- derived ratios (computed from the base measures, not stored) ---
      - name: aov
        sql: "{gmv} / NULLIF({orders}, 0)"
        type: number
        format: currency
      - name: upt
        sql: "{gross_units} / NULLIF({orders}, 0)"
        type: number
      - name: app
        sql: "{gmv} / NULLIF({gross_units}, 0)"
        type: number
        format: currency

    pre_aggregations:
      # Rollup that queries hit instead of scanning the mart. Rebuilt by the
      # refresh worker only when the mart's computed_at advances (i.e. when
      # Dagster/dbt rebuilds it) — not on a blind timer.
      - name: daily_rollup
        measures:
          - gmv
          - nmv
          - rmv
          - orders
          - gross_units
          - net_units
        dimensions:
          - shop_key
          - sales_channel
        time_dimension: metric_date
        granularity: day
        refresh_key:
          sql: SELECT MAX(computed_at) FROM analytics.metric_revenue_daily

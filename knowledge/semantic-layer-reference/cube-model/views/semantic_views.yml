# TEMPLATE views — governed consumer surfaces (company-agnostic)
#
# Views = the menu the consumer (agent/MCP, BI tool) actually queries; cubes are
# the plumbing. Only what is listed here is exposed. shop_key / tenant keys are
# intentionally NOT exposed — tenant scoping is enforced server-side
# (securityContext / queryRewrite), never chosen by the caller.
#
# Expose ONLY metrics that are servable for the brand. Drop measures whose upstream
# is blocked/missing (e.g. traffic without an analytics export, EMV where exchanges
# are invalid) so no one can query a 0-by-design number.
views:
  - name: commercial
    description: "Commercial/revenue metrics by day, channel, market, user type."
    cubes:
      - join_path: commercial_revenue
        includes:
          - metric_date
          - sales_channel
          - market
          - user_type
          - is_comp
          - nmv
          - gmv
          - emv
          - rmv
          - orders
          - booked_orders
          - traffic
          - qualified_traffic
          - units_sold
          - aov
          - booked_aov
          - cvr
          - booked_cvr
          - qualified_cvr
          - spv
          - aup
          - upo
          - muo
          - discount_rate
          - return_rate
          - cac

  - name: marketing
    description: "First-party (blended) marketing efficiency by day and channel."
    cubes:
      - join_path: marketing
        includes:
          - metric_date
          - channel
          - channel_group
          - funnel
          - domain
          - user_type
          - market
          - nmv
          - sales
          - spend
          - orders
          - sessions
          - new_customers
          - mer
          - target_mer
          - roas
          - cac
          - oac
          - cpo
          - cps
          - cpm
          - aov
          - cvr
          - spv
          - ctr
          - atc_rate
          - ev_per_spend

  - name: digital
    description: "On-site session funnel by day, channel group, device."
    cubes:
      - join_path: digital_sessions
        includes:
          - metric_date
          - channel_group
          - device_type
          - landing_page_type
          - sessions
          - sessions_qualified
          - orders
          - gmv
          - perc_qualified
          - perc_plp
          - perc_pdp
          - perc_atc
          - perc_checkout
          - cvr
          - spv
          - bounce_rate

  - name: customer
    description: "Cohort LTV, repeat and payback (mature cohorts only)."
    cubes:
      - join_path: customer_ltv
        includes:
          - acquisition_cohort
          - market
          - acquisition_channel
          - omni_status
          - first_order_aov_tier
          - is_matured_365d
          - customers
          - acquired_customers
          - nmv_365d
          - avg_ltv_365d
          - repeat_rate_365d
          - cac
          - ltv_cac_365d

  - name: retail
    description: "Store x stylist productivity by day."
    cubes:
      - join_path: retail_stylist
        includes:
          - metric_date
          - store
          - stylist
          - region
          - district
          - nmv
          - orders
          - total_hrs
          - selling_hrs
          - sph
          - ssph
          - selling_rate
          - muo
          - nps
          - nps_responses

  - name: returns
    description: "Order-cohort return economics (rr30). Filter is_matured_30d for headline."
    cubes:
      - join_path: returns_economics
        includes:
          - order_cohort_date
          - sales_channel
          - market
          - is_matured_30d
          - gmv
          - rmv_30
          - return_rate_30
          - exchange_rate_30
          - revenue_lost_30

  - name: merchandise
    description: "SKU/style performance & sell-through by day."
    cubes:
      - join_path: merch_product
        includes:
          - metric_date
          - unit_code
          - pillar
          - collection
          - material
          - unit_category
          - price_band
          - product_segmentation
          - sales_channel
          - gmv
          - nmv
          - gross_sales
          - quantity
          - net_merch_quantity
          - orders
          - page_views
          - aup
          - aur
          - gross_margin
          - gross_margin_rate
          - cvr
          - atc_rate
          - sell_through

  - name: operations
    description: "Shipment OTIF & fulfillment by day, warehouse, carrier."
    cubes:
      - join_path: operations_otif
        includes:
          - metric_date
          - warehouse_group
          - carrier_group
          - total_lines
          - otif_lines
          - otif_line_rate
          - otif_shipping_rate
          - delay_rate
          - warehouse_change_rate
          - percent_on_time_shipments
          - cost_per_shipment

  - name: inventory
    description: "Stock position. ALWAYS filter is_latest_snapshot=true (or one snapshot_date)."
    cubes:
      - join_path: inventory_snapshot
        includes:
          - snapshot_date
          - is_latest_snapshot
          - fulfillment_pool
          - unit_category
          - pillar
          - quantity_on_hand
          - quantity_available
          - weeks_of_stock_portfolio
          - sell_through
          - instock_percentage
          - at_risk_revenue_usd

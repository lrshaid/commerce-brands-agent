# TEMPLATE cube — Digital / Web sessions & funnel (company-agnostic)
#
# On-site session funnel. Source of truth = dbt marts (sessionization = 30-min
# inactivity timeout; qualified = 8s+ active; bot/fleet anti-joined).
#
# Grain: one row per (shop_key, metric_date, channel_group, device_type, landing_page_type).
cubes:
  - name: digital_sessions
    sql_table: analytics.metric_digital_session_daily   # <-- placeholder

    dimensions:
      - name: shop_key
        sql: shop_key
        type: string
      - name: metric_date
        sql: metric_date
        type: time
      - name: channel_group
        sql: channel_group
        type: string
      - name: device_type
        sql: device_type
        type: string
      - name: landing_page_type
        sql: landing_page_type
        type: string

    measures:
      # --- base, additive ---
      - name: sessions
        sql: sessions
        type: sum
      - name: sessions_qualified
        sql: sessions_qualified
        type: sum
      - name: session_plp
        sql: session_plp
        type: sum
      - name: session_pdp
        sql: session_pdp
        type: sum
      - name: session_atc
        sql: session_product_added
        type: sum
      - name: session_checkout
        sql: session_checkout
        type: sum
      - name: session_convert
        sql: session_convert
        type: sum
      - name: gmv
        sql: gmv_amount
        type: sum
        format: currency
      - name: orders
        sql: orders
        type: sum

      # --- derived funnel rates (share of sessions) ---
      - name: perc_qualified
        sql: "{sessions_qualified} / NULLIF({sessions}, 0)"
        type: number
        format: percent
      - name: perc_plp
        sql: "{session_plp} / NULLIF({sessions}, 0)"
        type: number
        format: percent
      - name: perc_pdp
        sql: "{session_pdp} / NULLIF({sessions}, 0)"
        type: number
        format: percent
      - name: perc_atc
        sql: "{session_atc} / NULLIF({sessions}, 0)"
        type: number
        format: percent
      - name: perc_checkout
        sql: "{session_checkout} / NULLIF({sessions}, 0)"
        type: number
        format: percent
      - name: cvr
        sql: "{session_convert} / NULLIF({sessions}, 0)"
        type: number
        format: percent
      - name: spv
        sql: "{gmv} / NULLIF({sessions}, 0)"
        type: number
        format: currency
      - name: bounce_rate
        sql: "1 - ({sessions_qualified} / NULLIF({sessions}, 0))"
        type: number
        format: percent

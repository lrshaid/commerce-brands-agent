# TEMPLATE cube — Customer / LTV / CAC (company-agnostic)
#
# Cohort LTV & payback. Source of truth = dbt marts. LTV is MATURITY-GATED
# (only cohorts old enough to have completed the N-day window count) — enforce the
# maturity filter in the mart or via `is_matured_*` dimensions before averaging.
# NMV here = GMV + EMV + RMV (RMV negative, nets).
#
# Grain: one row per (shop_key, acquisition_cohort, market, acquisition_channel, omni_status).
cubes:
  - name: customer_ltv
    sql_table: analytics.metric_ltv_cohort          # <-- placeholder

    dimensions:
      - name: shop_key
        sql: shop_key
        type: string
      - name: acquisition_cohort
        sql: acquisition_cohort
        type: time
      - name: market
        sql: market
        type: string
      - name: acquisition_channel   # display channel (4 attribution variants upstream)
        sql: acquisition_channel
        type: string
      - name: omni_status           # Web | Retail | Omnichannel
        sql: omni_status
        type: string
      - name: first_order_aov_tier
        sql: first_order_aov_tier
        type: string
      - name: is_matured_365d
        sql: is_matured_365d
        type: boolean

    measures:
      # --- base, additive ---
      - name: customers
        sql: customers
        type: sum
      - name: acquired_customers
        sql: acquired_customers
        type: sum
      - name: mature_customers_365d
        sql: mature_customers_365d
        type: sum
      - name: repeat_365d
        sql: repeat_365d
        type: sum
        description: "Customers with >=2 orders within 365d of acquisition."
      - name: nmv_365d
        sql: nmv_365d
        type: sum
        format: currency
        description: "Cohort NMV within 365d of acquisition (filter is_matured_365d)."
      - name: nmv_90d
        sql: nmv_90d
        type: sum
        format: currency
      - name: nmv_730d
        sql: nmv_730d
        type: sum
        format: currency
      - name: marketing_spend
        sql: marketing_spend
        type: sum
        format: currency

      # --- derived (customer-weighted; keep maturity filter on) ---
      - name: avg_ltv_365d
        sql: "{nmv_365d} / NULLIF({mature_customers_365d}, 0)"
        type: number
        format: currency
      - name: repeat_rate_365d
        sql: "{repeat_365d} / NULLIF({mature_customers_365d}, 0)"
        type: number
        format: percent
      - name: cac
        sql: "{marketing_spend} / NULLIF({acquired_customers}, 0)"
        type: number
        format: currency
      - name: ltv_cac_365d
        sql: "{avg_ltv_365d} / NULLIF({cac}, 0)"
        type: number
        description: ">3.0 generally healthy. Mature cohorts only."
